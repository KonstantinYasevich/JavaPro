version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: postgres-container
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: databaseJP
    ports:
      - "5433:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: